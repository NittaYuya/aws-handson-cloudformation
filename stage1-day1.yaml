AWSTemplateFormatVersion: "2010-09-09"
# [Stage1 / Day1] フォローアップ会 第2回 終了時点の環境（VPC / パブリックサブネット / IGW / ルートテーブル / SG / EC2 + Apache）
# 削除は「スタックの削除」で全リソースが消える。※ 説明文が英語なのは、コンソールが日本語を ???? と表示するため
Description: >-
  [Stage1 / Day1] Environment at the end of follow-up session 2:
  VPC, public subnet, IGW, route table, security group, EC2 with Apache running. Delete the stack to remove everything.

# ------------------------------------------------------------
# パラメータ（入力は 2 つだけ）
# ------------------------------------------------------------
Parameters:
  MyIp:
    Type: String
    # 自宅のグローバル IP。https://checkip.amazonaws.com/ の値をそのまま（/32 は不要）。SSH(22)/HTTP(80) をこの IP からだけ許可
    # ※ コンソールのパラメータ画面は日本語を表示できない（???? になる）ため、Description 類は英語にしている
    Description: >-
      Your home global IP address. Paste the value shown at https://checkip.amazonaws.com/ (e.g. 113.147.224.53).
      SSH(22) and HTTP(80) will be allowed only from this IP.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    ConstraintDescription: "Enter an IPv4 address like xxx.xxx.xxx.xxx (without /32)"

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    # 既存のキーペア名。事前に EC2 → キーペア → 「キーペアを作成」で作り、.pem を保存しておく
    Description: >-
      Name of an existing EC2 key pair for SSH. Create one first at EC2 console > Key pairs > Create key pair,
      and keep the downloaded .pem file.
    Default: kikagaku-cli-key

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: "Latest Amazon Linux 2023 AMI (no change needed)"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

# ------------------------------------------------------------
# 東京リージョン以外で作成しようとしたらエラーにする
# ------------------------------------------------------------
Rules:
  TokyoRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", "ap-northeast-1"]
        AssertDescription: "This template is for the Tokyo region (ap-northeast-1) only. Switch the region at the top right of the console."

Metadata:
  cfn-lint:
    config:
      ignore_checks: [W3010]   # AZ の固定は Notion 手順書（1a / 1c）と揃えるための意図的な設定
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Required" }
        Parameters: [MyIp, KeyName]
      - Label: { default: "No change needed" }
        Parameters: [LatestAmiId]
    ParameterLabels:
      MyIp: { default: "Home IP address (from checkip.amazonaws.com)" }
      KeyName: { default: "Key pair name" }

Resources:
  # ---------- ① VPC（器） ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: kikagaku-cli-vpc }

  # ---------- ② IGW（玄関）を VPC にアタッチ ----------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: kikagaku-cli-igw }

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ---------- ③ パブリックサブネット（区画） ----------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: kikagaku-cli-public-subnet }

  # ---------- ④ ルートテーブル（道）0.0.0.0/0 → IGW ----------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: kikagaku-cli-rtb }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------- ⑤ セキュリティグループ（警備員） ----------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: kikagaku-cli-sg
      GroupDescription: Web server security group (SSH/HTTP from my IP)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${MyIp}/32"
          Description: SSH from my home IP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Sub "${MyIp}/32"
          Description: HTTP from my home IP
      Tags:
        - { Key: Name, Value: kikagaku-cli-sg }

  # ---------- ⑥ EC2（Web サーバー）Apache 起動済み ----------
  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      Tags:
        - { Key: Name, Value: kikagaku-cli-ec2 }
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          # Notion 3 章「Web サーバーの構築」相当: Apache をインストールして起動・自動起動
          dnf install -y httpd
          systemctl enable httpd
          systemctl start httpd

Outputs:
  WebUrl:
    Description: "Open in browser. Success if you see It works! (note: http://, not https://)"
    Value: !Sub "http://${WebInstance.PublicIp}/"
  PublicIp:
    Description: "Web server public IP (changes after stop/start)"
    Value: !GetAtt WebInstance.PublicIp
  PrivateIp:
    Description: "Web server private IP (10.1.1.x)"
    Value: !GetAtt WebInstance.PrivateIp
  SshCommand:
    Description: "SSH command (run in the folder where the .pem is)"
    Value: !Sub "ssh -i ${KeyName}.pem ec2-user@${WebInstance.PublicIp}"
  VpcId:
    Value: !Ref VPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
