AWSTemplateFormatVersion: "2010-09-09"
# [Stage2 / Day2] フォローアップ会 第3回 終了時点の環境（Stage1 + プライベートサブネット / DB 用 EC2 / NAT + EIP / プライベート用ルートテーブル）
# 削除は「スタックの削除」で全リソースが消える。※ 説明文が英語なのは、コンソールが日本語を ???? と表示するため
Description: >-
  [Stage2 / Day2] Environment at the end of follow-up session 3:
  Stage1 plus private subnet, DB EC2, NAT gateway with Elastic IP, private route table. Delete the stack to remove everything.

Parameters:
  MyIp:
    Type: String
    # 自宅のグローバル IP。https://checkip.amazonaws.com/ の値をそのまま（/32 は不要）
    # ※ コンソールのパラメータ画面は日本語を表示できない（???? になる）ため、Description 類は英語にしている
    Description: >-
      Your home global IP address. Paste the value shown at https://checkip.amazonaws.com/ (e.g. 113.147.224.53).
      SSH(22) and HTTP(80) will be allowed only from this IP.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    ConstraintDescription: "Enter an IPv4 address like xxx.xxx.xxx.xxx (without /32)"

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    # 既存のキーペア名（Web サーバー・DB サーバー共通）
    Description: "Name of an existing EC2 key pair for SSH (used by both web and DB servers)"
    Default: kikagaku-cli-key

  EnableNat:
    Type: String
    # true = 第3回終了時点（NAT あり・時間課金あり）／ false = 宿題で NAT と EIP を削除した状態
    Description: >-
      Create the NAT gateway and Elastic IP? "true" = end of session 3 (NAT exists, hourly charge).
      "false" = after the homework where NAT and EIP were deleted (private subnet has VPC-local routing only).
    Default: "true"
    AllowedValues: ["true", "false"]

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: "Latest Amazon Linux 2023 AMI (no change needed)"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Rules:
  TokyoRegionOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", "ap-northeast-1"]
        AssertDescription: "This template is for the Tokyo region (ap-northeast-1) only. Switch the region at the top right of the console."

Conditions:
  CreateNat: !Equals [!Ref EnableNat, "true"]

Metadata:
  cfn-lint:
    config:
      ignore_checks: [W3010]   # AZ の固定は Notion 手順書（1a / 1c）と揃えるための意図的な設定
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Required" }
        Parameters: [MyIp, KeyName, EnableNat]
      - Label: { default: "No change needed" }
        Parameters: [LatestAmiId]
    ParameterLabels:
      MyIp: { default: "Home IP address (from checkip.amazonaws.com)" }
      KeyName: { default: "Key pair name" }
      EnableNat: { default: "Create NAT gateway (true / false)" }

Resources:
  # ============================================================
  # Stage1 と同じ部分（VPC / IGW / パブリックサブネット / Web サーバー）
  # ============================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: kikagaku-cli-vpc }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: kikagaku-cli-igw }

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: kikagaku-cli-public-subnet }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: kikagaku-cli-rtb }

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: kikagaku-cli-sg
      GroupDescription: Web server security group (SSH/HTTP from my IP)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub "${MyIp}/32"
          Description: SSH from my home IP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Sub "${MyIp}/32"
          Description: HTTP from my home IP
      Tags:
        - { Key: Name, Value: kikagaku-cli-sg }

  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      Tags:
        - { Key: Name, Value: kikagaku-cli-ec2 }
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          dnf install -y httpd
          systemctl enable httpd
          systemctl start httpd

  # ============================================================
  # Day2 で追加する部分（Notion 4 章・5 章）
  # ============================================================

  # ---------- プライベートサブネット（別 AZ: 1c） ----------
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.1.2.0/24
      AvailabilityZone: ap-northeast-1c
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: kikagaku-cli-private-subnet }

  # ---------- プライベート用ルートテーブル ----------
  # NAT なしのときは 10.1.0.0/16 local の 1 行だけ（＝閉域）
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: kikagaku-cli-rtb-private }

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # ---------- NAT ゲートウェイ（パブリックサブネットに置く）＋ Elastic IP ----------
  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateNat
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: kikagaku-handson1-ngw-eip }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNat
    Properties:
      SubnetId: !Ref PublicSubnet
      AllocationId: !GetAtt NatEip.AllocationId
      ConnectivityType: public
      Tags:
        - { Key: Name, Value: kikagaku-handson1-ngw }

  # 0.0.0.0/0 → NAT（この 1 行で「外に出られるプライベート」になる）
  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ---------- DB サーバー用セキュリティグループ（SSH はパブリックサブネットからだけ） ----------
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: kikagaku-cli-sg-private
      GroupDescription: DB server security group (SSH from public subnet only)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.1.1.0/24
          Description: SSH from public subnet (bastion)
      Tags:
        - { Key: Name, Value: kikagaku-cli-sg-private }

  # ---------- DB サーバー（パブリック IP なし） ----------
  DbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref DbSecurityGroup
      Tags:
        - { Key: Name, Value: kikagaku-cli-ec2-private }

Outputs:
  WebUrl:
    Description: "Open in browser (http://)"
    Value: !Sub "http://${WebInstance.PublicIp}/"
  WebPublicIp:
    Description: "Web server (bastion) public IP"
    Value: !GetAtt WebInstance.PublicIp
  DbPrivateIp:
    Description: "DB server private IP (ssh target from bastion; does not change after stop/start)"
    Value: !GetAtt DbInstance.PrivateIp
  NatPublicIp:
    Condition: CreateNat
    Description: "NAT gateway Elastic IP (the IP your pair-work partner adds to their SG)"
    Value: !Ref NatEip
  Step1CopyKeyToBastion:
    Description: "Step1: run on your PC. Copy the .pem to the bastion (Notion ch.4)"
    Value: !Sub "scp -i ${KeyName}.pem ${KeyName}.pem ec2-user@${WebInstance.PublicIp}:/home/ec2-user/"
  Step2SshToBastion:
    Description: "Step2: run on your PC. SSH into the bastion"
    Value: !Sub "ssh -i ${KeyName}.pem ec2-user@${WebInstance.PublicIp}"
  Step3SshToDb:
    Description: "Step3: run inside the bastion. SSH into the DB server (prompt changes to ip-10-1-2-x)"
    Value: !Sub "ssh -i ${KeyName}.pem ec2-user@${DbInstance.PrivateIp}"
  VpcId:
    Value: !Ref VPC
